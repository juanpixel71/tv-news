<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap: content: blob:;">
    <title>Reproductor TV</title>
    <link rel="stylesheet" href="css/index.css">
    <!-- Librería HLS.js para soportar streams .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header class="app-header">
        <h1>Mi Reproductor TV</h1>
    </header>

    <main class="app-content">
        <div class="video-container">
            <video id="mainPlayer" controls playsinline poster="https://via.placeholder.com/800x450?text=Selecciona+un+canal">
                Tu navegador no soporta el reproductor de video.
            </video>
            <div id="videoTitle" class="video-title">Selecciona un canal</div>
        </div>

        <div id="statusMessage" class="status-message">Cargando lista de canales...</div>
        <button id="reloadBtn" class="reload-btn" style="display: none;">Reintentar Cargar Lista</button>

        <div id="buttonsContainer" class="buttons-grid"></div>
    </main>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
