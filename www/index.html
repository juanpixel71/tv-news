<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Permitir cualquier conexión externa y reproducción de video -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap: content: blob: https: http:;">
    <title>Reproductor TV</title>
    
    <!-- Motor HLS.js para canales .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- ESTILOS CSS INTEGRADOS -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header sin texto, padding-top de 25px y sin borde rojo */
        .app-header {
            background-color: #1e1e1e;
            padding-top: 25px;
            padding-bottom: 15px;
            padding-left: 15px;
            padding-right: 15px;
            text-align: center;
        }

        .app-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-container {
            width: 100%;
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            max-height: 60vh;
            display: block;
            background-color: #000000;
        }

        /* Vista horizontal con padding arriba/abajo para no achatar el vídeo */
        @media screen and (orientation: landscape) {
            .app-header, .status-message, .reload-btn, .buttons-grid {
                display: none !important;
            }

            body, .app-content {
                padding: 0;
                margin: 0;
                width: 100vw;
                height: 100vh;
                background-color: #000000;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .video-container {
                padding: 20px 0;
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            video {
                width: 100%;
                height: 100%;
                max-height: calc(100vh - 40px);
                object-fit: contain;
            }
        }

        .status-message {
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
        }

        .reload-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .btn-stream {
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #3a3a3a;
            padding: 12px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        /* Estado activo seleccionado permanentemente en rojo */
        .btn-stream.active-channel {
            background-color: #e50914 !important;
            border-color: #ffffff !important;
        }
    </style>
</head>
<body>

    <header class="app-header"></header>

    <main class="app-content">
        <div class="video-container">
            <video id="mainPlayer" controls playsinline poster="https://via.placeholder.com/800x450?text=Selecciona+un+canal">
                Tu navegador no soporta el reproductor de video.
            </video>
        </div>

        <div id="statusMessage" class="status-message">Cargando lista de canales...</div>
        <button id="reloadBtn" class="reload-btn" style="display: none;">Reintentar Cargar Lista</button>

        <div id="buttonsContainer" class="buttons-grid"></div>
    </main>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
